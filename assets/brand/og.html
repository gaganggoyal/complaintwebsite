<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og</title>
<!--
  Source for the social-share card (og.png, 1200x630).

  Render it with headless Chrome, from the project root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=assets/brand/og.png --window-size=1200,630 \
      assets/brand/og.html

  Fonts are deliberately system faces, not the site's webfonts: this file is
  rendered once on a Mac, never served to visitors, so a network fetch here
  would only add a way for the render to silently fall back.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(760px 460px at 82% 8%,rgba(255,122,51,.42),transparent 62%),
      radial-gradient(600px 500px at 4% 100%,rgba(37,211,102,.14),transparent 60%),
      linear-gradient(155deg,#1f4d5e,#0d2430 70%);
    color:#fff;position:relative}
  .tri{position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,#ff7a33 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
  .pad{padding:64px 68px;height:100%;display:flex;flex-direction:column}

  .brand{display:flex;align-items:center;gap:18px}
  .badge{width:76px;height:76px;border-radius:22px;flex:0 0 auto;
    background:linear-gradient(145deg,#ff8a45,#e85a18);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(236,95,34,.45),inset 0 1px 0 rgba(255,255,255,.5)}
  .badge svg{width:44px;height:44px}
  .wm b{display:block;font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
  .wm b em{font-style:normal;color:#ffb27a}
  .wm span{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8fb0bd}

  h1{margin-top:auto;font-size:63px;font-weight:800;letter-spacing:-2px;line-height:1.08}
  h1 .g{color:#ffc56d}
  .hi{margin-top:14px;font-size:29px;font-weight:600;color:#cfe0e7;letter-spacing:-.2px;
    font-family:"Kohinoor Devanagari","Devanagari Sangam MN",-apple-system,sans-serif}

  .chips{margin-top:26px;display:flex;gap:11px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);
    border-radius:100px;padding:11px 21px;font-size:19px;font-weight:600;color:#e6f0f4}
  .chip b{color:#fff;font-weight:800}

  .foot{margin-top:auto;padding-top:34px;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.15)}
  .url{font-size:27px;font-weight:800;letter-spacing:-.4px}
  .url em{font-style:normal;color:#ff9d5c}
  .wa{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:700;color:#8ff0b6}
  .wa i{width:13px;height:13px;border-radius:50%;background:#25D366;display:block;
    box-shadow:0 0 0 5px rgba(37,211,102,.22)}
</style>
</head>
<body>
<div class="tri"></div>
<div class="pad">

  <div class="brand">
    <div class="badge">
      <svg viewBox="0 0 24 24"><path d="M12 2.3 4.3 5.2v6c0 4.5 3.1 8.3 7.7 10.4 4.6-2.1 7.7-5.9 7.7-10.4v-6L12 2.3Z" fill="#fff" fill-opacity=".96"/><path d="m8.3 12 2.6 2.6 4.8-5.1" fill="none" stroke="#e85a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="wm">
      <b>complaint<em>.website</em></b>
      <span>An IndiaOffers.in Company</span>
    </div>
  </div>

  <h1>Your complaint,<br>written by a <span class="g">human expert</span>.</h1>
  <div class="hi">आपकी शिकायत, हमारी ज़िम्मेदारी — कोई AI नहीं, असली इंसान।</div>

  <div class="chips">
    <div class="chip">Starts at <b>₹9</b></div>
    <div class="chip">E-commerce · Banking · Telecom</div>
    <div class="chip">15+ years of experience</div>
  </div>

  <div class="foot">
    <div class="url">complaint<em>.website</em></div>
    <div class="wa"><i></i> WhatsApp 95696 08101</div>
  </div>

</div>
</body>
</html>
